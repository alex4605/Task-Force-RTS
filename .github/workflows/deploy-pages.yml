# Builds the game and publishes it to GitHub Pages on every push to main.
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages is still set to "Deploy from a branch", GitHub also publishes the raw source on
      # every push, which would overwrite the built game (a blank page). Wait for that build to
      # finish so this deployment is the last one. With Source = "GitHub Actions" there is no
      # such build and this step returns at once.
      - name: Wait for any branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            status=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest" | jq -r '.status // "none"')
            echo "branch build: $status"
            case "$status" in queued|building) sleep 5 ;; *) break ;; esac
          done
      - id: deployment
        uses: actions/deploy-pages@v4
